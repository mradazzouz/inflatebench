# Model names live here, never in code. Fill in the provider model ids before a run.
# API keys are read only from environment variables: ANTHROPIC_API_KEY for anthropic,
# and the variable named by api_key_env for openai_compatible (none needed for Ollama).
# Optional per model: max_tokens, prompt_cache (anthropic, default true), cache_ttl (5m | 1h).
models:
  main:          # cheap hosted model, run through the Batch API
    provider: anthropic
    name: CHANGE_ME
    batch: true
  local:         # ~8B open model through Ollama
    provider: openai_compatible
    name: llama3.1:8b
    base_url: http://localhost:11434/v1
  strong:        # stronger model on the 60-scenario subset
    provider: anthropic
    name: CHANGE_ME
    subset: 60

# Judges for ib judge: two families score every summary; the third breaks ties. Each is a
# key under models: above, or an inline entry like {provider: anthropic, name: some-model-id}.
judges:
  - CHANGE_ME
  - CHANGE_ME
tiebreak: CHANGE_ME

agent: main      # model key that acts on each summary in ib probe (override with --model)

# USD per million tokens, keyed by model name; used for per-call cost logging and by
# `ib compact --dry-run`. cache_write and cache_read default to 1.25x and 0.1x input,
# batch_discount to 0.5. Models without an entry (e.g. local Ollama) cost 0.
#   some-model-id: {input: 1.00, output: 5.00, cache_read: 0.10}
prices: {}

conditions: [free, sectioned, keep_rules, extractor, pinning]
repeats: 3

paths:
  scenarios: data/scenarios.jsonl
  pilot: data/pilot.jsonl
  heldout: data/heldout
  runs: runs
  cache: .cache/requests
