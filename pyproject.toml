[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inflatebench"
version = "0.0.1"
description = "Benchmark for constraint inflation in context compaction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ib = "inflatebench.cli:main"

[tool.setuptools.packages.find]
include = ["inflatebench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"inflatebench.conditions" = ["prompts/*.md"]
